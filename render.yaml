# Render Blueprint — deploys the API and the admin dashboard.
# Render dashboard → New → Blueprint → pick this repo. Every `sync: false`
# variable is prompted for once during setup (values stay in Render, not git).
services:
  - type: web
    name: edushorts-api
    runtime: node
    rootDir: backend
    plan: free # switch to "starter" for launch: free instances sleep, delaying webhooks
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false # e.g. https://edushorts-admin.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
      - key: RAZORPAY_TOTAL_COUNT
        value: "12"
      - key: RAZORPAY_PLAN_DISPLAY_AMOUNT_PAISE
        value: "19900"
      - key: RAZORPAY_PLAN_DISPLAY_INTERVAL
        value: month
      - key: RAZORPAY_BRAND_NAME
        value: EduShorts
      - key: BUNNY_STREAM_LIBRARY_ID
        sync: false
      - key: BUNNY_STREAM_API_KEY
        sync: false
      - key: BUNNY_CDN_HOSTNAME
        sync: false
      - key: BUNNY_CDN_TOKEN_KEY
        sync: false
      - key: BUNNY_EMBED_TOKEN_KEY
        sync: false
      - key: BUNNY_URL_TTL_SECONDS
        value: "3600"

  - type: web
    name: edushorts-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://edushorts-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
